<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
</head>
<body>
    <div class="calculator">
        <div class="display">123</div>
        <button class="calcInputs" id="smileBtn">:D</button>
        <button class="calcInputs" id="clearDisplay">Clear</button>
        <button class="calcInputs" id="backspaceBtn">Backspace</button>
        <button class="calcInputs" id="divideBtn">/</button>
        <button class="calcInputs" id="sevenBtn">7</button>
        <button class="calcInputs" id="eightBtn">8</button>
        <button class="calcInputs" id="nineBtn">9</button>
        <button class="calcInputs" id="multiplyBtn">*</button>
        <button class="calcInputs" id="sixBtn">6</button>
        <button class="calcInputs" id="fiveBtn">5</button>
        <button class="calcInputs" id="fourBtn">4</button>
        <button class="calcInputs" id="subtractBtn">-</button>
        <button class="calcInputs" id="oneBtn">1</button>
        <button class="calcInputs" id="twoBtn">2</button>
        <button class="calcInputs" id="threeBtn">3</button>
        <button class="calcInputs" id="addBtn">+</button>
        <button class="calcInputs" id="frontBtn">D:</button>
        <button class="calcInputs" id="zeroBtn">0</button>
        <button class="calcInputs" id="decimalBtn">.</button>
        <button class="calcInputs" id="equalBtn">=</button>
    </div>
</body>
</html>
